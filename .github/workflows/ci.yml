name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gtawiki
          POSTGRES_PASSWORD: gtawiki
          POSTGRES_DB: gtawiki
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U gtawiki"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://gtawiki:gtawiki@localhost:5434/gtawiki
      TEST_DATABASE_URL: postgres://gtawiki:gtawiki@localhost:5434/gtawiki_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: psql "$DATABASE_URL" -c 'CREATE DATABASE gtawiki_test'
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:seed:sample
      - run: npm run build
